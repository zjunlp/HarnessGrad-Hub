    }
  </style>
  <rect class="bg" width="32" height="32" rx="7" />
  <rect class="bar" x="7" y="22" width="4.5" height="4" rx="1" />
  <rect class="bar" x="13.75" y="8" width="4.5" height="18" rx="1" />
  <rect class="bar" x="20.5" y="8" width="4.5" height="18" rx="1" />
</svg>
