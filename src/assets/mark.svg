<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 10 51 48" role="img" aria-label="HarnessGrad">
  <!-- The header mark: the same curve as the favicon, without the background plate so it
       sits on the page. See public/favicon.svg for why it is four marks and not a stroke. -->
  <style>
    .bar { fill: #1a1a17; }
    .last { fill: #a94e2e; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #f2f0e9; }
      .last { fill: #df8a68; }
    }
  </style>
  <rect class="bar"  x="8"    y="48" width="9.5" height="8"  rx="2.5" />
  <rect class="bar"  x="20.5" y="42" width="9.5" height="14" rx="2.5" />
  <rect class="bar"  x="33"   y="31" width="9.5" height="25" rx="2.5" />
  <rect class="last" x="45.5" y="12" width="9.5" height="44" rx="2.5" />
</svg>
