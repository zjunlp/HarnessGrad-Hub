# Build the site at the repository root and publish it to GitHub Pages.
#
# This repository **is** the site: `pnpm build` here produces `dist/`, and this workflow
# publishes it. The platform that the numbers come from lives in `zjunlp/HarnessGrad`; this
# repository never runs an experiment and cannot change what one measures.
#
# The site is a *project* page, so its URLs live under /HarnessGrad-Hub/. That prefix is
# configured once, as `base` in `astro.config.mjs`; `scripts/check-links.mjs` reads it back
# out of the built canonical URL and fails the build on a root-absolute link that would
# 404, so the two cannot drift silently.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The Pages site itself is a one-time repository setting -- Settings -> Pages ->
      # Source: GitHub Actions. This step only reads that configuration. Do not add
      # `enablement: true` to paper over a missing setting: creating a Pages site requires
      # repository admin, and the workflow's GITHUB_TOKEN never has it, so it fails with
      # "Resource not accessible by integration" instead of saying what is actually wrong.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
